name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight; a merge to main
# is never cancelled mid-verification.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify the diff once so the heavy jobs run only when the change can
  # reach them (issue #355). Unknown or undecidable scope keeps the
  # all-true defaults: a narrower run is never taken on faith.
  changes:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      test: ${{ steps.classify.outputs.test }}
      fuzz_inject: ${{ steps.classify.outputs.fuzz_inject }}
      fuzz_core: ${{ steps.classify.outputs.fuzz_core }}
      fuzz_connectors: ${{ steps.classify.outputs.fuzz_connectors }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        name: Classify changed files
        run: |
          set -uo pipefail

          head_sha="${{ github.sha }}"
          case "${{ github.event_name }}" in
            pull_request) base_sha="${{ github.event.pull_request.base.sha }}" ;;
            push)         base_sha="${{ github.event.before }}" ;;
            *)            base_sha="" ;;
          esac

          # Watch sets for the three fuzz groups (issue #355): each group
          # reruns only when the code its targets exercise changes — the
          # group's own package plus the internal packages its Fuzz bodies
          # call into. Keep these in sync with the target lists in the Fuzz
          # jobs and the imports of each *_fuzz_test.go; TestCIFuzzScope in
          # internal enforces the sync.
          fuzz_inject_watch='internal/core/inject/*|internal/shared/*|testdata/*'
          fuzz_core_watch='internal/kinds/*|internal/core/links/*|internal/shared/*|internal/core/match_fuzz_test.go|internal/core/testdata/*'
          fuzz_connectors_watch='internal/connectors/*|internal/kinds/*|internal/shared/*'

          # 'true' means "run this job". Defaults run everything so a
          # missing base, an empty diff, or a script failure cannot skip
          # verification; only a trustworthy diff narrows them.
          go=true
          test=true
          fuzz_inject=true
          fuzz_core=true
          fuzz_connectors=true

          diff_lines=""
          if [ -n "$base_sha" ] && [ "$base_sha" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            diff_base="$base_sha"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              mb=$(git merge-base "$base_sha" "$head_sha" 2>/dev/null) || mb=""
              if [ -n "$mb" ]; then
                diff_base="$mb"
              fi
            fi
            # --no-renames so a rename reports both paths; --name-status so a
            # deletion is visible (it can break //go:embed or a file-reading
            # test even when the path itself looks inert).
            diff_lines=$(git diff --name-status --no-renames "$diff_base" "$head_sha" 2>/dev/null) || diff_lines=""
          fi

          watch_match() {
            local path=$1 pat=$2 p
            local IFS='|'
            # Patterns are data, not globs: stop bash from expanding them
            # against the worktree before case matches them.
            set -f
            for p in $pat; do
              case "$path" in
                $p)
                  set +f
                  return 0
                  ;;
              esac
            done
            set +f
            return 1
          }

          if [ -n "$diff_lines" ]; then
            go=false
            test=false
            fuzz_inject=false
            fuzz_core=false
            fuzz_connectors=false

            while IFS=$'\t' read -r status f; do
              if [ -z "${f:-}" ]; then
                continue
              fi

              case "$status" in
                D*) go=true; test=true ;;
              esac

              case "$f" in
                *.go|go.mod|go.sum) go=true ;;
              esac

              # The Test job is broad on purpose: public hygiene walks every
              # text file in the tree, so anything that is not structurally
              # invisible to it can break tests. Only binary blobs and
              # non-workflow .github metadata are inert. Workflow files are
              # the opposite of inert — editing CI must still see the full
              # battery run against the new configuration.
              case "$f" in
                .github/workflows/*)
                  go=true; test=true
                  fuzz_inject=true; fuzz_core=true; fuzz_connectors=true
                  ;;
                .github/*) ;;
                *.png|*.jpg|*.jpeg|*.webp|*.gif|*.ico|*.woff|*.woff2|*.ttf|*.db|*.out|*.bundle) ;;
                *) test=true ;;
              esac

              case "$f" in
                go.mod|go.sum)
                  fuzz_inject=true; fuzz_core=true; fuzz_connectors=true
                  ;;
                *)
                  if watch_match "$f" "$fuzz_inject_watch"; then fuzz_inject=true; fi
                  if watch_match "$f" "$fuzz_core_watch"; then fuzz_core=true; fi
                  if watch_match "$f" "$fuzz_connectors_watch"; then fuzz_connectors=true; fi
                  ;;
              esac
            done <<< "$diff_lines"
          fi

          {
            echo "go=$go"
            echo "test=$test"
            echo "fuzz_inject=$fuzz_inject"
            echo "fuzz_core=$fuzz_core"
            echo "fuzz_connectors=$fuzz_connectors"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1
          go tool cover -func=coverage.out | sort -t$'\t' -k3 -n | head -n 20

      - name: Coverage floor
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          # Fail if statement coverage drops below the floor (raise as suites grow).
          floor=80.0
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t+0 < f+0) {
              printf "coverage %.1f%% is below floor %.1f%%\n", t+0, f+0
              exit 1
            }
            printf "coverage %.1f%% meets floor %.1f%%\n", t+0, f+0
          }'

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # staticcheck is the blocking linter (issue #107). Keep the pin in sync
      # with AGENTS.md "Commands". Fail the job on any finding.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Staticcheck
        run: '"$(go env GOPATH)/bin/staticcheck" ./...'

  # Short CI fuzz runs over the hostile-input parsers (issue #107). Seeds in
  # f.Add / testdata/fuzz always run as ordinary tests in the Test job; these
  # jobs spend a bounded budget mutating them. Each group runs only when the
  # scope job says its code changed (issue #355), and the three groups are
  # separate jobs so they run in parallel rather than serially.
  #
  # Targets live in ./internal/core, ./internal/core/inject and
  # ./internal/connectors — the repo root package has no test files, so
  # fuzzing `.` exits 0 with "[no test files]" and mutates nothing. Keep each
  # list in sync with `go test -run='^$' -list='^Fuzz'` on that package
  # (TestCIFuzzScope in internal/core enforces the sync).
  fuzz-inject:
    name: Fuzz (inject)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fuzz_inject != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz inject parsers
        run: |
          set -euo pipefail
          inject_targets=(
            FuzzInjectRequestInstructions
            FuzzDetectBodyShape
          )
          for t in "${inject_targets[@]}"; do
            echo "==> ${t}"
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/core/inject
          done

  fuzz-core:
    name: Fuzz (core)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fuzz_core != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz core parsers
        run: |
          set -euo pipefail
          core_targets=(
            FuzzNormalizeIdentityKey
            FuzzCleanYouTubeTitle
            FuzzTrackIdentityKey
            FuzzMergeTracksSync
            FuzzMergePlaylistsSync
            FuzzPlaylistLinkKey
            FuzzMergeAlbumsSync
          )
          for t in "${core_targets[@]}"; do
            echo "==> ${t}"
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/core
          done

  fuzz-connectors:
    name: Fuzz (connectors)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fuzz_connectors != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz connector parsers
        run: |
          set -euo pipefail
          connectors_targets=(
            FuzzParseTakeoutMessage
            FuzzWalkMboxFrom
            FuzzIsMboxFromLine
            FuzzTakeoutMessageID
          )
          for t in "${connectors_targets[@]}"; do
            echo "==> ${t}"
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/connectors
          done

  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o aegis .

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Local file + fragment check (catches heading-rename breakage).
      # External URLs are skipped offline so CI stays deterministic.
      - name: Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments --verbose './**/*.md'
          fail: true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History scan catches secrets that were committed then deleted.
          fetch-depth: 0

      # Generic credential patterns (API keys, tokens, private keys).
      # Project-specific identity leaks are covered by
      # internal/core/public_hygiene_test.go in the Test job.
      # Pin matches a released gitleaks binary; bump deliberately.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks
        run: gitleaks detect --source . --redact --no-banner --verbose
