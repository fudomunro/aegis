name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1
          go tool cover -func=coverage.out | sort -t$'\t' -k3 -n | head -n 20

      - name: Coverage floor
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          # Fail if statement coverage drops below the floor (raise as suites grow).
          floor=80.0
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t+0 < f+0) {
              printf "coverage %.1f%% is below floor %.1f%%\n", t+0, f+0
              exit 1
            }
            printf "coverage %.1f%% meets floor %.1f%%\n", t+0, f+0
          }'

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o aperture-guardian .
